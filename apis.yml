- aid: google-apigee:google-apigee-analytics-api
  name: Google Apigee Analytics API
  description: >-
    The Apigee Analytics API provides access to API usage metrics, traffic data, error rates, latency
    statistics, and custom reports generated by the Apigee analytics engine. It allows developers and
    operations teams to query and export analytics data programmatically for custom dashboards and business
    intelligence tooling.
  humanURL: >-
