- aid: google-apigee:google-apigee-api-hub
  name: Google Apigee API Hub
  description: >-
    Apigee API Hub is a centralized repository and governance platform for discovering, managing, and
    analyzing APIs across an organization. It enables teams to register APIs, manage API versions and
    specifications, enforce API standards, and gain visibility into the full API portfolio across multiple
    gateways and environments.
  humanURL: https://cloud.google.com/apigee/docs/apihub/what-is-api-hub
  baseURL: https://apihub.googleapis.com
